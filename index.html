<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">
        <header>
            <h1>Weather Dashboard</h1>
            <p>Check the current weather of any city</p>
        </header>

        <form id="weatherForm" class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g. Pune)" aria-label="City name" required>
            <button type="submit" id="searchButton">Search</button>
        </form>

        <p id="message" role="status" aria-live="polite">
            Enter a city name to see its weather.
        </p>

        <section id="weatherResult" class="weather-card" hidden>
            <h2 id="cityName">City</h2>
            <p id="weatherDescription">Weather condition</p>

            <div class="temperature">
                <span id="temperature">--</span><span>°C</span>
            </div>

            <div class="weather-details">
                <div class="detail">
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>Wind Speed</span>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>Feels Like</span>
                    <strong id="feelsLike">--°C</strong>
                </div>
            </div>

            <p id="updatedTime" class="updated-time"></p>
        </section>

        <footer>
            <p>Weather Dashboard | Powered by Shubhangi</p>
        </footer>
    </main>

</body>

</html>
